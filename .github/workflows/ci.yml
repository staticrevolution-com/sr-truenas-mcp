name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Mondays 08:00 UTC. An advisory published against unchanged code is
    # invisible to a push-triggered audit — the tree does not have to move for
    # the risk to appear.
    - cron: '0 8 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run type-check
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # BLOCKING — runtime tree only, high and above.
      #
      # This is the set that actually ships, inside the published npm package
      # and the GHCR image, so a hit is a release blocker rather than a chore.
      # It is scoped to --omit=dev deliberately: gating on devDependency
      # advisories means the gate fails on a test-runner CVE that cannot reach
      # production, and a gate that cries wolf is one somebody adds
      # continue-on-error to. The full tree is still reported, just below.
      #
      # ⚠ If this ever fails on something genuinely unreachable, do NOT relax
      # the level to `critical` — that silently drops the whole `high` class,
      # including the ws transport advisory this gate was added for. Add a
      # dated `overrides` entry or an explicit allowlist instead, so the
      # exception stays visible rather than being absorbed into the threshold.
      - name: Audit runtime dependencies (blocking, high+)
        run: npm audit --omit=dev --audit-level=high

      # ADVISORY ONLY — never blocks the build.
      # devDependency advisories are build-host exposure, not shipped
      # exposure. They belong in front of a human, not in front of a merge.
      - name: Audit full tree (advisory)
        if: always()
        run: |
          {
            echo '### npm audit — full tree (advisory, non-blocking)'
            echo ''
            echo '```'
            npm audit --audit-level=low 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image is the production artifact — the gateway runs the GHCR
      # container, not this repo's source — but nothing built it outside a
      # `release: published` run, so `node-version` here and `FROM` in the
      # Dockerfile could drift apart with every check green. That is how four
      # releases shipped on node:20-alpine, EOL since April 2026.
      #
      # The file-vs-file half of that gate lives in `ci-claims.test.ts`
      # ("Every artifact names the same Node major"), where it also runs
      # locally and names the offending file. Deliberately not repeated here:
      # a restated check is a second thing to decay, not a second check. What
      # is left in this job is only what a unit test structurally cannot do —
      # build the image and run what is inside it.

      - name: Build the image
        run: docker build -t sr-truenas-mcp:ci .

      # Proves the image's Node major from the image itself, not from the
      # Dockerfile text the previous step read. A digest pin can outlive the
      # tag beside it, so the tag is not evidence of what is inside.
      - name: Assert the built image's own Node runtime
        run: |
          IN_IMAGE="$(docker run --rm --entrypoint node sr-truenas-mcp:ci -v)"
          echo "node in image: ${IN_IMAGE}"
          EXPECTED="$(sed -n 's/^FROM node:\([0-9][0-9]*\)-alpine.*/\1/p' Dockerfile | sort -u)"
          case "$IN_IMAGE" in
            v"$EXPECTED".*) echo "matches FROM node:${EXPECTED}-alpine" ;;
            *) echo "::error::image runs ${IN_IMAGE}, expected v${EXPECTED}.x"; exit 1 ;;
          esac

      # The entrypoint is `node dist/bundle.cjs`, so these run the bundled
      # artifact the gateway actually executes. Without --build-arg the stamp
      # falls back to `<pkg.version>+unknown`; assert the version half, which
      # catches a bundle that never got the esbuild --define.
      - name: Run the bundle inside the image
        run: |
          PKG_VER="$(node -p 'require("./package.json").version')"
          OUT="$(docker run --rm sr-truenas-mcp:ci --version)"
          echo "--version: ${OUT}"
          case "$OUT" in
            "$PKG_VER"+*) echo "stamp carries package.json version ${PKG_VER}" ;;
            *) echo "::error::--version printed '${OUT}', expected ${PKG_VER}+<provenance>"; exit 1 ;;
          esac
          docker run --rm sr-truenas-mcp:ci --help
