name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write       # Sigstore OIDC token for attest-* actions
  attestations: write   # Write build-provenance / SBOM attestations (B4)
  # Docker image attestation is intentionally deferred to a follow-up: the
  # current docker job uses plain `docker build`/`docker push`, which does
  # not surface the pushed image digest. Switching to `docker buildx build
  # --push --metadata-file=...` is the prerequisite.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  binary:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:binary
      - run: |
          cd dist
          tar czf sr-truenas-mcp-linux-x64.tar.gz sr-truenas-mcp
          sha256sum sr-truenas-mcp-linux-x64.tar.gz > sr-truenas-mcp-linux-x64.tar.gz.sha256

      # B4 (partial): SPDX SBOM of the post-build npm dependency graph
      # (full tree, runtime + build-time). Useful for vulnerability review
      # of the deployable artifact even without Sigstore attestation. The
      # action's auto-upload-to-release path needs `actions: read` for the
      # workflow-artifact API, which we deliberately don't grant — instead
      # we let the action just write the file locally and append it to the
      # explicit `gh release upload` below.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: sr-truenas-mcp-linux-x64.spdx.json
          output-file: dist/sr-truenas-mcp-linux-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest binary tarball provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/sr-truenas-mcp-linux-x64.tar.gz

      - name: Attest SBOM (binds SBOM to tarball)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/sr-truenas-mcp-linux-x64.tar.gz
          sbom-path: dist/sr-truenas-mcp-linux-x64.spdx.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/sr-truenas-mcp-linux-x64.tar.gz \
            dist/sr-truenas-mcp-linux-x64.tar.gz.sha256 \
            dist/sr-truenas-mcp-linux-x64.spdx.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.release.tag_name }}"
          # Strip leading "v" from the tag for the version stamp so it
          # matches the bundle script's natural format (1.0.1+abc1234).
          PKG_VER="${TAG#v}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_VERSION="${PKG_VER}+${SHORT_SHA}"
          docker build \
            --build-arg "BUILD_VERSION=${BUILD_VERSION}" \
            -t "${IMAGE_LOWER}:${TAG}" -t "${IMAGE_LOWER}:latest" .
          docker push "${IMAGE_LOWER}:${TAG}"
          docker push "${IMAGE_LOWER}:latest"

  npm-tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Attest npm tarball provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: sr-truenas-mcp-*.tgz

      - name: Upload npm tarball to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            sr-truenas-mcp-*.tgz
