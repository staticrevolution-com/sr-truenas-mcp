name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  # Sigstore/GitHub attestations need short-lived OIDC tokens + the
  # ability to write attestation records back to the repo. Required by
  # actions/attest-build-provenance and actions/attest-sbom (B4).
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  binary:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:binary
      - run: |
          cd dist
          tar czf sr-truenas-mcp-linux-x64.tar.gz sr-truenas-mcp
          sha256sum sr-truenas-mcp-linux-x64.tar.gz > sr-truenas-mcp-linux-x64.tar.gz.sha256

      # B4: SPDX SBOM for the binary tarball + Sigstore attestations.
      # The SBOM scans the post-build npm dependency graph (full tree —
      # both runtime and build-time deps that contributed to the binary).
      # attest-build-provenance signs the binary tarball; attest-sbom
      # links the two so downstream verifiers can prove which SBOM
      # corresponds to which binary.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: sr-truenas-mcp-linux-x64.spdx.json
          output-file: dist/sr-truenas-mcp-linux-x64.spdx.json
      - name: Attest binary build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/sr-truenas-mcp-linux-x64.tar.gz
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/sr-truenas-mcp-linux-x64.tar.gz
          sbom-path: dist/sr-truenas-mcp-linux-x64.spdx.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/sr-truenas-mcp-linux-x64.tar.gz \
            dist/sr-truenas-mcp-linux-x64.tar.gz.sha256 \
            dist/sr-truenas-mcp-linux-x64.spdx.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build and push Docker image
        id: build
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.release.tag_name }}"
          # Strip leading "v" from the tag for the version stamp so it
          # matches the bundle script's natural format (1.0.1+abc1234).
          PKG_VER="${TAG#v}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_VERSION="${PKG_VER}+${SHORT_SHA}"
          docker build \
            --build-arg "BUILD_VERSION=${BUILD_VERSION}" \
            -t "${IMAGE_LOWER}:${TAG}" -t "${IMAGE_LOWER}:latest" .
          docker push "${IMAGE_LOWER}:${TAG}"
          docker push "${IMAGE_LOWER}:latest"
          # Capture the digest of the pushed image for attest-build-provenance.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_LOWER}:${TAG}" | cut -d'@' -f2)
          {
            echo "image_lower=${IMAGE_LOWER}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"
      # B4: Sigstore attestation for the container image. Verifiable later
      # with `gh attestation verify oci://<image>@<digest> --owner <owner>`.
      - name: Attest container image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.build.outputs.image_lower }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  npm-tarball:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Upload npm tarball to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            sr-truenas-mcp-*.tgz
