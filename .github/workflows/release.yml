name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run bundle
      - run: npx pkg dist/bundle.cjs --target node20-linux-x64 --output dist/sr-truenas-mcp --compress GZip
      - run: |
          cd dist
          tar czf sr-truenas-mcp-linux-x64.tar.gz sr-truenas-mcp
          sha256sum sr-truenas-mcp-linux-x64.tar.gz > sr-truenas-mcp-linux-x64.tar.gz.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/sr-truenas-mcp-linux-x64.tar.gz \
            dist/sr-truenas-mcp-linux-x64.tar.gz.sha256
