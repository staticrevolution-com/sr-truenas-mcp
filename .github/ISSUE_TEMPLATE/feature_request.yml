name: Feature request
description: Suggest a new TrueNAS action, capability, or behavior change
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check the existing [open issues](https://github.com/staticrevolution-com/sr-truenas-mcp/issues) and [PLAN.md](../blob/master/PLAN.md) — the proposal may already be tracked.

        For larger changes (new transports, refactors, deviations from the safety model), open this as a discussion first; not every feature request fits the project direction, and a five-minute conversation here saves an hour of work later.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the proposed solution. What can't you do today that you need to do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        If this is a new TrueNAS action, name the underlying middleware method (e.g. `pool.dataset.snapshot.create`) and propose a tier classification (0/1/2/3 — see CLAUDE.md). If this is a behavior change, sketch the API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they don't fit.

  - type: dropdown
    id: tier
    attributes:
      label: Safety tier (if applicable)
      description: |
        For new actions: which tier should this be? See README → Architecture → Safety tiers.
      options:
        - "Not applicable"
        - "Tier 0 — never expose (gives the LLM dangerous capability)"
        - "Tier 1 — confirm + reason (irreversible or high-blast-radius)"
        - "Tier 2 — confirm (modifies state but recoverable)"
        - "Tier 3 — open (read or safe operation)"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, anything else that helps.
